name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm db:generate

      - name: Check for ungenerated migrations
        run: |
          if ! git diff --quiet drizzle/; then
            echo "❌ Drizzle migrations are out of date. Run 'pnpm db:generate' and commit the changes."
            git diff drizzle/
            exit 1
          fi

      - run: pnpm test
